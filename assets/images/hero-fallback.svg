  <!-- foreground lamps -->
  <g fill="#130d0a">
    <ellipse cx="150" cy="790" rx="100" ry="32"/><rect x="140" y="690" width="20" height="110"/>
    <ellipse cx="150" cy="680" rx="55" ry="16"/>
  </g>
  <g fill="#ffca65"><path d="M150 625 C125 660 140 690 150 694 C160 690 175 660 150 625Z"/></g>
  <rect width="1600" height="900" fill="#071112" opacity=".18"/>
